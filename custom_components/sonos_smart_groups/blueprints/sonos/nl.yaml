          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Lage tonen
                value: bass
              - label: Hoge tonen
                value: treble
              - label: Balans
                value: balance
              - label: Loudness
                value: loudness
              - label: Subwoofer aan/uit
                value: sub_enabled
              - label: Subwoofer-versterking
                value: sub_gain
              - label: Subwoofer-crossover
