            boolean: null
        required_source:
          name: Alleen bij deze bron
          description: Leeg laten voor elke bron. Sonos noemt zijn ingangen `TV`, `Line-in`,
            `AirPlay` en `Spotify Connect`; een line-in die vanuit een andere kamer gedeeld
            wordt verschijnt onder de naam van díé kamer. Gebruik dit als dezelfde kamer zich
            anders moet gedragen afhankelijk van wat er wordt afgespeeld — één slimme groep
            voor de tv, een andere voor muziek.
          default: ''
          selector:
            select:
              custom_value: true
              options:
              - TV
              - Line-in
              - AirPlay
              - Spotify Connect
        on_leader_stop:
          name: Wanneer de leider stopt
