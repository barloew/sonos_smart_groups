              options:
              - label: Laat alles zoals het is
                value: nothing
              - label: Haal de volgers uit de groep
                value: unjoin
              - label: Pauzeer de volgers
                value: pause
        require_on:
          name: Alleen als deze aan staan
          description: Elke entiteit hier moet aan staan. Een goede plek voor een hoofdschakelaar
            waarmee je al je slimme groepen in één keer uitschakelt.
          default: []
          selector:
            entity:
              multiple: true
        block_if_on:
          name: Nooit terwijl deze aan staan
          default: []
          selector:
            entity:
              multiple: true
        block_if_playing:
          name: Nooit terwijl deze kamers spelen
          description: Kamers die voorrang op deze groep krijgen. Meestal overbodig zodra
            je voorrangsschakelaars gebruikt.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: media_player
    precedence_section:
      name: 4 · Voorrang
      icon: mdi:crown-outline
      description: |-
        Hiermee kan de ene slimme groep de andere overtroeven. Sla deze sectie over als de kamers in deze groep niet ook in andere groepen voorkomen.

        Een **superieure** groep krijgt voorrang zodra zijn leider begint af te spelen, en die leider wordt de *hoofdleider*. **ondergeschikte** groepen wijken, staan hun kamers af, en nemen ze daarna weer terug.

        Maak eerst een voorrangsschakelaar aan: Instellingen → Apparaten en diensten → Sonos Smart Groups → Configureren.
      collapsed: true
      input:
        precedence_role:
          name: Voorrangsrol van deze slimme groep
          default: none
          selector:
            select:
              options:
              - label: Doet niet mee aan voorrang
                value: none
              - label: Superieur — krijgt voorrang op andere groepen
                value: superior
              - label: Ondergeschikt — geeft voorrang aan de superieure groep
                value: subordinate
          description: |-
            **Superieur** — krijgt voorrang zodra zijn leider begint af te spelen, en andere groepen maken plaats.

            **Ondergeschikt** — staat zijn kamers af aan wie de voorrangsschakelaar vasthoudt, en neemt ze daarna terug.
        precedence_lock:
          name: Voorrangsschakelaar
          description: Een schakelaar uit de integratie Sonos Smart Groups.
          default: []
          selector:
            entity:
              filter:
              - domain: switch
                integration: sonos_smart_groups
        stand_down_action:
          name: Bij het inschakelen van voorrang doen de kamers van deze groep dit
          default: join_principal
          selector:
            select:
              options:
              - label: Sluiten zich aan bij de superieure groep
                value: join_principal
              - label: Verlaten de groep en vallen stil
                value: unjoin
              - label: Pauzeren waar ze zijn
                value: pause
        on_precedence_end:
          name: Wanneer de voorrang wordt uitgeschakeld
          description: 'Opnieuw opbouwen is meestal het juiste: een slimme groep weet precies
