          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 1
              unit_of_measurement: s
        tolerance:
          name: Volumetolerantie
          description: Verschillen kleiner dan dit worden met rust gelaten. Dit is wat voorkomt
