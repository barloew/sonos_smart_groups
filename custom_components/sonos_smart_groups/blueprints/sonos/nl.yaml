blueprint:
  name: Sonos Smart Group
  source_url: https://raw.githubusercontent.com/barloew/sonos_smart_groups/main/custom_components/sonos_smart_groups/blueprints/sonos_smart_group.yaml
  description: |-
    Een smart group is één leader-kamer met een willekeurig aantal followers die zich aan hem aanpassen.

    **Followers nemen over wat jij kiest.** Volume, dempen, bron, afspelen — en als je wilt ook de equalizer- en home theater-instellingen. Volume, lage en hoge tonen kunnen per follower geschaald worden, zodat de kamer aan de andere kant van een open ruimte wat luider staat zonder dat je er ooit nog aan hoeft te denken.

    **Smart groups kunnen voorrang op elkaar krijgen.** Markeer er één als *superior* en die gaat voor: subordinate groepen staan hun kamers af en krijgen ze daarna terug. Een home theater die de woonkamer meeneemt zolang de film loopt is het klassieke geval.

    **Smart groups kunnen zichzelf starten.** Op een bewegingssensor, op een tijdstip, op elke trigger die je kunt bedenken — met een bron of met een specifieke afspeellijst, album, artiest of zender.

    ---

    Eén automatisering beschrijft één smart group. Twee kamers die elkaar beide kanten op moeten volgen hebben er twee nodig, één per richting.

    Vereist de integratie Sonos Smart Groups.
  domain: automation
  homeassistant:
    min_version: 2025.7.0
  input:
    group_section:
      name: 1 · De smart group
      icon: mdi:speaker-multiple
      description: Wie leidt, en wie volgt. Alleen de leader wordt in de gaten gehouden —
        followers starten zelf nooit iets, en dat is precies wat voorkomt dat twee kamers
        elkaar gaan achtervolgen.
      collapsed: false
      input:
        leader:
          name: Leader
          description: De kamer waar de rest zich naar richt. Kies degene die je in de praktijk
            aanraakt als je de muziek wilt veranderen — de keuken dus, niet het kantoor.
          selector:
            entity:
              filter:
              - domain: media_player
                integration: sonos
              - domain: media_player
                integration: music_assistant
        followers:
          name: Followers
          description: |-
            Eén regel per kamer.

            **Volumefactor** is ten opzichte van de leader. 1.0 houdt ze gelijk, 1.4 maakt de follower merkbaar luider, 0.8 juist zachter. In een open woonkamer wil de kamer het verst van de bank meestal 1.2 tot 1.5.

            **Lage- en hoge-tonenfactor** werken hetzelfde en doen alleen iets als je in sectie 2 het overnemen van de equalizer aanzet. Laat ze op 1.0 tenzij een kamer zijn speakers in een hoek of tegen glas heeft staan.

            **Aan de groep toevoegen** trekt de kamer in de groep van de leader, zodat ze hetzelfde synchroon afspelen. Laat het uit voor een follower die alleen het volume moet volgen terwijl hij iets anders speelt.
          selector:
            object:
              label_field: speaker
              description_field: volume_factor
              multiple: true
              fields:
                speaker:
                  label: Kamer
                  required: true
                  selector:
                    entity:
                      filter:
                      - domain: media_player
                        integration: sonos
                      - domain: media_player
                        integration: music_assistant
                volume_factor:
                  label: Volumefactor
                  required: true
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
                join:
                  label: Aan de groep toevoegen
                  selector:
                    boolean: null
                bass_factor:
                  label: Factor lage tonen
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
                treble_factor:
                  label: Factor hoge tonen
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
    copy_section:
      name: 2 · Wat followers overnemen
      icon: mdi:content-copy
      description: |-
        Volume en dempen passen bij vrijwel elke smart group. De rest staat er voor als je het nodig hebt.

        Instellingen die een kamer niet heeft worden stilzwijgend overgeslagen, dus je kunt surround gerust aanvinken voor een groep waarin een soundbar en boekenplankspeakers samen zitten.
      collapsed: false
      input:
        copy_playback:
          name: Afspelen
          description: Bron en afspelen gelden alleen voor followers die buiten de groep blijven
            — kamers binnen een groep volgen hun leader daarin al.
          default:
          - volume
          - mute
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Volume — geschaald met de factor van elke follower
                value: volume
              - label: Dempen
                value: mute
              - label: Bron — alleen voor ongegroepeerde followers
                value: source
              - label: Afspelen en pauzeren — alleen voor ongegroepeerde followers
                value: transport
              - label: Crossfade
                value: cross_fade
        copy_equalizer:
          name: Equalizer
          description: Sonos bewaart deze per kamer. Ze overnemen is wat een groep als één
            systeem laat klinken in plaats van als een paar losse.
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Lage tonen
                value: bass
              - label: Hoge tonen
                value: treble
              - label: Balans
                value: balance
              - label: Loudness
                value: loudness
              - label: Subwoofer aan/uit
                value: sub_enabled
              - label: Subwoofer-versterking
                value: sub_gain
              - label: Subwoofer-crossover
                value: sub_crossover
        copy_home_theater:
          name: Home theater
          description: Alleen soundbars en amps hebben deze. Surroundinstellingen tussen twee
            soundbars kopiëren is ongebruikelijk; meestal laat je dit leeg en laat je het
            home theater ze zelf beheren.
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Surround aan/uit
                value: surround_enabled
              - label: Surroundniveau
                value: surround_level
              - label: Surroundniveau voor muziek
                value: music_surround_level
              - label: Vol volume voor muzieksurround
                value: surround_mode
              - label: Spraakverbetering
                value: dialog_level
              - label: Nachtgeluid
                value: night_mode
              - label: Audiovertraging (lipsynchronisatie)
                value: audio_delay
    when_section:
      name: 3 · Wanneer de groep zich vormt
      icon: mdi:play-circle-outline
      description: Standaard vormt de groep zich zodra de leader begint te spelen, en dat
        is wat de meeste mensen willen.
      collapsed: true
      input:
        require_playing:
          name: Alleen terwijl de leader speelt
          description: Zet dit uit als followers het volume van de leader ook moeten volgen
            wanneer er niets speelt.
          default: true
          selector:
            boolean: null
        required_source:
          name: Alleen bij deze bron
          description: Leeg laten voor elke bron. Sonos noemt zijn ingangen `TV`, `Line-in`,
            `AirPlay` en `Spotify Connect`; een line-in die vanuit een andere kamer gedeeld
            wordt verschijnt onder de naam van díé kamer. Gebruik dit als dezelfde kamer zich
            anders moet gedragen afhankelijk van wat er speelt — één smart group voor de tv,
            een andere voor muziek.
          default: ''
          selector:
            select:
              custom_value: true
              options:
              - TV
              - Line-in
              - AirPlay
              - Spotify Connect
        on_leader_stop:
          name: Wanneer de leader stopt
          default: nothing
          selector:
            select:
              options:
              - label: Laat alles zoals het is
                value: nothing
              - label: Haal de followers uit de groep
                value: unjoin
              - label: Pauzeer de followers
                value: pause
        require_on:
          name: Alleen als deze aan staan
          description: Elke entiteit hier moet aan staan. Een goede plek voor een hoofdschakelaar
            waarmee je al je smart groups in één keer stillegt.
          default: []
          selector:
            entity:
              multiple: true
        block_if_on:
          name: Nooit terwijl deze aan staan
          default: []
          selector:
            entity:
              multiple: true
        block_if_playing:
          name: Nooit terwijl deze kamers spelen
          description: Kamers die boven deze groep gaan. Meestal overbodig zodra je voorrangssloten
            gebruikt.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: media_player
    precedence_section:
      name: 4 · Voorrang
      icon: mdi:crown-outline
      description: |-
        Hiermee kan de ene smart group de andere overtroeven. Sla deze sectie over als je groepen nooit elkaars kamers hoeven te lenen.

        Een **superior** groep krijgt voorrang zodra zijn leader begint te spelen, en die leader wordt de *principal*. **Subordinate** groepen wijken, staan hun kamers af, en nemen ze daarna weer terug.

        Maak eerst een slot aan: Instellingen → Apparaten en diensten → Sonos Smart Groups → Configureren.
      collapsed: true
      input:
        precedence_role:
          name: Deze smart group is
          default: none
          selector:
            select:
              options:
              - label: Doet niet mee aan voorrang
                value: none
              - label: Superior — krijgt voorrang op andere groepen
                value: superior
              - label: Subordinate — wijkt voor de superior groep
                value: subordinate
          description: |-
            **Superior** — krijgt voorrang zodra zijn leader begint te spelen, en andere groepen maken plaats.

            **Subordinate** — staat zijn kamers af aan wie het slot vasthoudt, en neemt ze daarna terug.
        precedence_lock:
          name: Voorrangsslot
          description: Een schakelaar uit de integratie Sonos Smart Groups.
          default: []
          selector:
            entity:
              filter:
              - domain: switch
                integration: sonos_smart_groups
        stand_down_action:
          name: Bij het wijken doen de kamers van deze groep dit
          default: join_principal
          selector:
            select:
              options:
              - label: Sluiten zich aan bij de superior groep
                value: join_principal
              - label: De groep verlaten en stil vallen
                value: unjoin
              - label: Pauzeren waar ze zijn
                value: pause
        on_precedence_end:
          name: Wanneer de voorrang wordt vrijgegeven
          description: 'Opnieuw opbouwen is meestal het juiste: een smart group weet precies
            hoe hij eruit hoort te zien, dus hij vormt zichzelf gewoon opnieuw. Er komt geen
            snapshot aan te pas.'
          default: rebuild
          selector:
            select:
              options:
              - label: Deze smart group opnieuw opbouwen zoals ingesteld
                value: rebuild
              - label: Laat alles zoals het is
                value: keep
              - label: Alle kamers vrijgeven
                value: release
        precedence_timeout:
          name: Wachttijd voor het vrijgeven van voorrang
          description: Als de principal pauzeert wordt de voorrang niet meteen losgelaten
            — een korte wachttijd voorkomt dat een pauze voor de deurbel de hele opstelling
            uit elkaar trekt. Zet op 0 om los te laten zodra het afspelen stopt.
          default: 60
          selector:
            number:
              min: 0
              max: 1800
              step: 5
              unit_of_measurement: s
        hold_switch:
          name: Vasthoudschakelaar
          description: Zolang deze aan staat wordt de voorrang nooit vrijgegeven, hoe lang
            er ook gepauzeerd wordt. Handig voor een schakelaar "filmavond".
          default: ''
          selector:
            entity:
              filter:
              - domain: switch
              - domain: input_boolean
    autostart_section:
      name: 5 · Vanzelf starten
      icon: mdi:motion-sensor
      description: Laat de leader uit zichzelf beginnen. Laat de triggers leeg om dit helemaal
        over te slaan.
      collapsed: true
      input:
        start_triggers:
          name: Starten wanneer
          description: Elke trigger die je wilt — een bewegingssensor, een lamp die aangaat,
            een tijdstip, een agenda-afspraak, een NFC-tag.
          default: []
          selector:
            trigger: null
        start_conditions:
          name: Maar alleen als
          default: []
          selector:
            condition: null
        start_media:
          name: Speel dit af
          description: |-
            Opent de mediabrowser: je Sonos-favorieten, je lokale muziekbibliotheek, en Spotify of Plex als je die integraties gebruikt.

            Favorieten zijn de toegang tot al het andere. Apple Music, Tidal, TuneIn en Sonos Radio kun je niet doorbladeren vanuit Home Assistant, maar wat je één keer in de Sonos-app als favoriet markeert verschijnt hier.

            Laat leeg als je alleen van ingang wilt wisselen — gebruik daarvoor het veld hieronder.
          default: {}
          selector:
            media: null
        start_source:
          name: Of schakel naar deze ingang
          description: Wordt alleen gebruikt als je hierboven niets kiest. `TV` voor de eigen
            ingang van een soundbar; een line-in die vanuit een andere kamer gedeeld wordt
            verschijnt onder de naam van die kamer.
          default: ''
          selector:
            select:
              custom_value: true
              options:
              - TV
              - Line-in
              - AirPlay
              - Spotify Connect
        start_volume:
          name: Zet de leader op dit volume
          description: 0 laat het volume ongemoeid.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
        start_action:
          name: Daarna
          default: play
          selector:
            select:
              options:
              - label: Beginnen met afspelen
                value: play
              - label: Pauzeren
                value: pause
              - label: Alleen de bron en het volume instellen
                value: nothing
    tuning_section:
      name: 6 · Fijnafstelling
      icon: mdi:tune
      description: De standaardwaarden bevallen vrijwel iedereen. Kom hier pas terug als iets
        traag, schokkerig of te gretig aanvoelt.
      collapsed: true
      input:
        debounce:
          name: Bezinktijd
          description: Hoe lang het volume van de leader stil moet staan voordat de followers
            meebewegen. Eén seconde maakt van het slepen aan een schuif één aanpassing. Zet
            op 0 voor de snelste reactie op knoppen van een afstandsbediening.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 1
              unit_of_measurement: s
        tolerance:
          name: Volumetolerantie
          description: Verschillen kleiner dan dit worden met rust gelaten. Dit is wat voorkomt
            dat twee kamers elkaar heen en weer duwen. 0,5 laat elke afzonderlijke volumestap
            door.
          default: 0.5
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
        gap_ms:
          name: Pauze tussen commando's
          description: Wachttijd na elk commando. Verhoog dit als het afspelen hapert.
          default: 120
          selector:
            number:
              min: 0
              max: 2000
              step: 10
              unit_of_measurement: ms
        cooldown:
          name: Afkoeltijd
          description: Minimale tijd tussen twee uitvoeringen. 0 schakelt het uit.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
        only_when_coordinator:
          name: Alleen als de leader de baas is
          description: Houdt deze smart group stil zolang zijn leader zelf iemand anders volgt.
            Laat aan staan tenzij je weet dat je het anders wilt.
          default: true
          selector:
            boolean: null
        extra_triggers:
          name: Extra triggers
          default: []
          selector:
            trigger: null
        extra_conditions:
          name: Extra voorwaarden
          default: []
          selector:
            condition: null
        before_actions:
          name: Vooraf uitvoeren
          default: []
          selector:
            action: null
        after_actions:
          name: Achteraf uitvoeren
          default: []
          selector:
            action: null
mode: restart
max_exceeded: silent
triggers:
- trigger: state
  entity_id: !input 'leader'
  attribute: volume_level
  for:
    seconds: !input 'debounce'
  id: sync
- trigger: state
  entity_id: !input 'leader'
  attribute: is_volume_muted
  id: sync
- trigger: state
  entity_id: !input 'leader'
  to: playing
  id: leader_started
- trigger: state
  entity_id: !input 'leader'
  from: playing
  id: leader_stopped
- trigger: state
  entity_id: !input 'leader'
  attribute: source
  id: sync
- trigger: state
  entity_id: !input 'leader'
  attribute: group_members
  for:
    seconds: 2
  id: sync
- trigger: state
  entity_id: !input 'precedence_lock'
  to: 'on'
  id: precedence_taken
- trigger: state
  entity_id: !input 'precedence_lock'
  to: 'off'
  id: precedence_released
- triggers: !input 'start_triggers'
- triggers: !input 'extra_triggers'
variables:
  leader: !input 'leader'
  followers: !input 'followers'
  copy_playback: !input 'copy_playback'
  copy_equalizer: !input 'copy_equalizer'
  copy_home_theater: !input 'copy_home_theater'
  require_playing: !input 'require_playing'
  required_source: !input 'required_source'
  on_leader_stop: !input 'on_leader_stop'
  require_on: !input 'require_on'
  block_if_on: !input 'block_if_on'
  block_if_playing: !input 'block_if_playing'
  precedence_role: !input 'precedence_role'
  precedence_lock: !input 'precedence_lock'
  stand_down_action: !input 'stand_down_action'
  on_precedence_end: !input 'on_precedence_end'
  precedence_timeout: !input 'precedence_timeout'
  hold_switch: !input 'hold_switch'
  start_trigger_list: !input 'start_triggers'
  start_media: !input 'start_media'
  start_source: !input 'start_source'
  start_volume: !input 'start_volume'
  start_action: !input 'start_action'
  tolerance: !input 'tolerance'
  gap_ms: !input 'gap_ms'
  cooldown: !input 'cooldown'
  only_when_coordinator: !input 'only_when_coordinator'
  mirror: |-
    {{ (copy_playback | default([]))
       + (copy_equalizer | default([]))
       + (copy_home_theater | default([])) }}
  follower_ids: '{{ (followers | default([])) | map(attribute=''speaker'') | list }}'
  members: '{{ state_attr(leader, ''group_members'') or [] }}'
  builtin_ids:
  - sync
  - leader_started
  - leader_stopped
  - precedence_taken
  - precedence_released
  from_user: '{{ (trigger.id | default('''', true)) not in builtin_ids }}'
  has_autostart: '{{ (start_trigger_list | default([], true) | count) > 0 }}'
  principal: |-
    {{ state_attr(precedence_lock, 'principal')
       if (precedence_lock | default('', true) | length) > 0 else none }}
  standing_down: |-
    {{ precedence_role == 'subordinate'
       and (precedence_lock | default('', true) | length) > 0
       and is_state(precedence_lock, 'on')
       and principal is not none and principal != leader }}
conditions:
- condition: template
  alias: Required switches are on
  value_template: |-
    {{ (require_on | default([]) | count) == 0
       or (require_on | select('is_state', 'on') | list | count)
          == (require_on | count) }}
- condition: template
  alias: Cooldown has passed
  value_template: |-
    {{ (cooldown | int(0)) == 0
       or this.attributes.last_triggered is none
       or (now() - this.attributes.last_triggered).total_seconds()
          > (cooldown | int(0)) }}
- condition: and
  conditions: !input 'extra_conditions'
actions:
- choose:
  - alias: Stand down for the principal
    conditions:
    - condition: template
      value_template: '{{ trigger.id == ''precedence_taken'' and standing_down }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ stand_down_action == ''join_principal'' }}'
        sequence:
        - action: media_player.unjoin
          target:
            entity_id: '{{ follower_ids + [leader] }}'
        - delay:
            milliseconds: 300
        - action: media_player.join
          target:
            entity_id: '{{ principal }}'
          data:
            group_members: '{{ follower_ids + [leader] }}'
      - conditions:
        - condition: template
          value_template: '{{ stand_down_action == ''pause'' }}'
        sequence:
        - action: media_player.media_pause
          target:
            entity_id: '{{ follower_ids + [leader] }}'
      default:
      - action: media_player.unjoin
        target:
          entity_id: '{{ follower_ids + [leader] }}'
  - alias: Precedence released
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'precedence_released'
           and precedence_role == 'subordinate'
           and on_precedence_end != 'keep' }}
    sequence:
    - action: media_player.unjoin
      target:
        entity_id: '{{ follower_ids + [leader] }}'
    - condition: template
      alias: Rebuild rather than release
      value_template: '{{ on_precedence_end == ''rebuild'' }}'
    - delay:
        milliseconds: 400
    - action: sonos_smart_groups.apply
      data:
        leader: '{{ leader }}'
        followers: '{{ followers }}'
        mirror: '{{ mirror }}'
        tolerance: '{{ tolerance }}'
        gap_ms: '{{ gap_ms }}'
  - alias: Take precedence
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'leader_started'
           and precedence_role == 'superior'
           and (precedence_lock | default('', true) | length) > 0 }}
    sequence:
    - action: sonos_smart_groups.take_precedence
      data:
        lock: '{{ precedence_lock }}'
        principal: '{{ leader }}'
    - action: sonos_smart_groups.apply
      data:
        leader: '{{ leader }}'
        followers: '{{ followers }}'
        mirror: '{{ mirror }}'
        tolerance: '{{ tolerance }}'
        gap_ms: '{{ gap_ms }}'
  - alias: Release precedence after the timeout
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'leader_stopped'
           and precedence_role == 'superior'
           and (precedence_lock | default('', true) | length) > 0 }}
    sequence:
    - delay:
        seconds: '{{ precedence_timeout | int(60) }}'
    - condition: template
      alias: Still stopped, and not being held
      value_template: |-
        {{ not is_state(leader, 'playing')
           and ((hold_switch | default('', true) | length) == 0
                or not is_state(hold_switch, 'on')) }}
    - action: sonos_smart_groups.release_precedence
      data:
        lock: '{{ precedence_lock }}'
  - alias: Start by itself
    conditions:
    - condition: template
      value_template: '{{ from_user and has_autostart }}'
    sequence:
    - condition: and
      conditions: !input 'start_conditions'
    - if:
      - condition: template
        value_template: '{{ (start_volume | int(0)) > 0 }}'
      then:
      - action: media_player.volume_set
        target:
          entity_id: '{{ leader }}'
        data:
          volume_level: '{{ (start_volume | float(0)) / 100 }}'
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {{ (start_media | default({}, true)).get('media_content_id')
               is not none }}
        sequence:
        - action: media_player.play_media
          target:
            entity_id: '{{ leader }}'
          data:
            media_content_id: '{{ start_media.media_content_id }}'
            media_content_type: '{{ start_media.media_content_type }}'
      - conditions:
        - condition: template
          value_template: '{{ (start_source | default('''', true) | trim | length) > 0 }}'
        sequence:
        - action: media_player.select_source
          target:
            entity_id: '{{ leader }}'
          data:
            source: '{{ start_source }}'
        - delay:
            milliseconds: 400
    - if:
      - condition: template
        value_template: '{{ start_action == ''play'' }}'
      then:
      - action: media_player.media_play
        target:
          entity_id: '{{ leader }}'
    - if:
      - condition: template
        value_template: '{{ start_action == ''pause'' }}'
      then:
      - action: media_player.media_pause
        target:
          entity_id: '{{ leader }}'
  - alias: Leader stopped
    conditions:
    - condition: template
      value_template: '{{ trigger.id == ''leader_stopped'' }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ on_leader_stop == ''unjoin'' }}'
        sequence:
        - action: media_player.unjoin
          target:
            entity_id: '{{ follower_ids }}'
      - conditions:
        - condition: template
          value_template: '{{ on_leader_stop == ''pause'' }}'
        sequence:
        - action: media_player.media_pause
          target:
            entity_id: '{{ follower_ids }}'
      default:
      - stop: Leader stopped; nothing to do.
  default:
  - condition: template
    alias: Not currently standing down for a superior group
    value_template: '{{ not standing_down }}'
  - condition: template
    alias: No blocking switch is on
    value_template: |-
      {{ (block_if_on | default([]) | select('is_state', 'on')
          | list | count) == 0 }}
  - condition: template
    alias: No blocking room is playing
    value_template: |-
      {{ (block_if_playing | default([]) | select('is_state', 'playing')
          | list | count) == 0 }}
  - condition: template
    alias: The leader is in charge of its own group
    value_template: |-
      {{ not only_when_coordinator
         or (members | count) == 0
         or members[0] == leader }}
  - condition: template
    alias: Source matches
    value_template: |-
      {{ (required_source | default('', true) | trim | length) == 0
         or ((state_attr(leader, 'source') or '') | lower)
            == (required_source | lower | trim) }}
  - condition: template
    alias: Leader is playing
    value_template: '{{ not require_playing or is_state(leader, ''playing'') }}'
  - sequence: !input 'before_actions'
  - action: sonos_smart_groups.apply
    data:
      leader: '{{ leader }}'
      followers: |-
        {{ followers | map('combine', {'join': false}) | list
           if not is_state(leader, 'playing') else followers }}
      mirror: '{{ mirror }}'
      tolerance: '{{ tolerance }}'
      gap_ms: '{{ gap_ms }}'
  - sequence: !input 'after_actions'
