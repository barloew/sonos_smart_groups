          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Surround aan/uit
                value: surround_enabled
              - label: Surroundniveau
                value: surround_level
              - label: Surroundniveau voor muziek
                value: music_surround_level
              - label: Vol volume voor muzieksurround
                value: surround_mode
              - label: Spraakverbetering
                value: dialog_level
              - label: Nachtgeluid
                value: night_mode
              - label: Audiovertraging (lipsynchronisatie)
                value: audio_delay
    when_section:
      name: 3 · Wanneer de kamers zich groeperen
      icon: mdi:play-circle-outline
      description: Standaard groeperen de kamers zich zodra de leider begint af te spelen,
