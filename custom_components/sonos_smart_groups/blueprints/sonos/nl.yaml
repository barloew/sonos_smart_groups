          default: 0.5
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
        gap_ms:
          name: Pauze tussen commando's
          description: Wachttijd na elk commando. Verhoog dit als het afspelen hapert.
          default: 120
          selector:
            number:
              min: 0
              max: 2000
              step: 10
              unit_of_measurement: ms
        cooldown:
          name: Afkoeltijd
          description: Minimale tijd tussen twee wijzigingen. 0 schakelt het uit.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
        only_when_coordinator:
          name: Alleen wanneer de leider wordt bediend
          description: Houdt deze slimme groep stil zolang zijn leider zelf iemand anders
            volgt. Laat aan staan tenzij je weet dat je het anders wilt.
          default: true
          selector:
            boolean: null
        extra_triggers:
          name: Extra triggers
          default: []
          selector:
            trigger: null
        extra_conditions:
          name: Extra voorwaarden
          default: []
          selector:
            condition: null
        before_actions:
          name: Vooraf uitvoeren
          default: []
          selector:
            action: null
        after_actions:
          name: Achteraf uitvoeren
          default: []
          selector:
            action: null
mode: restart
max_exceeded: silent
triggers:
- trigger: state
  entity_id: !input 'leader'
  attribute: volume_level
  for:
    seconds: !input 'debounce'
  id: sync
- trigger: state
  entity_id: !input 'leader'
  attribute: is_volume_muted
  id: sync
- trigger: state
  entity_id: !input 'leader'
  to: playing
  id: leader_started
- trigger: state
  entity_id: !input 'leader'
  from: playing
  id: leader_stopped
- trigger: state
  entity_id: !input 'leader'
  attribute: source
  id: sync
- trigger: state
  entity_id: !input 'leader'
  attribute: group_members
  for:
    seconds: 2
  id: sync
- trigger: state
  entity_id: !input 'precedence_lock'
  to: 'on'
  id: precedence_taken
- trigger: state
  entity_id: !input 'precedence_lock'
  to: 'off'
  id: precedence_released
- triggers: !input 'start_triggers'
- triggers: !input 'extra_triggers'
variables:
  leader: !input 'leader'
  followers: !input 'followers'
  copy_playback: !input 'copy_playback'
  copy_equalizer: !input 'copy_equalizer'
  copy_home_theater: !input 'copy_home_theater'
  require_playing: !input 'require_playing'
  required_source: !input 'required_source'
  on_leader_stop: !input 'on_leader_stop'
  require_on: !input 'require_on'
  block_if_on: !input 'block_if_on'
  block_if_playing: !input 'block_if_playing'
  precedence_role: !input 'precedence_role'
  precedence_lock: !input 'precedence_lock'
  stand_down_action: !input 'stand_down_action'
  on_precedence_end: !input 'on_precedence_end'
  precedence_timeout: !input 'precedence_timeout'
  hold_switch: !input 'hold_switch'
  start_trigger_list: !input 'start_triggers'
  start_media: !input 'start_media'
  start_source: !input 'start_source'
  start_volume: !input 'start_volume'
  start_action: !input 'start_action'
  tolerance: !input 'tolerance'
  gap_ms: !input 'gap_ms'
  cooldown: !input 'cooldown'
  only_when_coordinator: !input 'only_when_coordinator'
  mirror: |-
    {{ (copy_playback | default([]))
       + (copy_equalizer | default([]))
       + (copy_home_theater | default([])) }}
  follower_ids: '{{ (followers | default([])) | map(attribute=''speaker'') | list }}'
  members: '{{ state_attr(leader, ''group_members'') or [] }}'
  builtin_ids:
  - sync
  - leader_started
  - leader_stopped
  - precedence_taken
  - precedence_released
  from_user: '{{ (trigger.id | default('''', true)) not in builtin_ids }}'
  has_autostart: '{{ (start_trigger_list | default([], true) | count) > 0 }}'
  principal: |-
    {{ state_attr(precedence_lock, 'principal')
       if (precedence_lock | default('', true) | length) > 0 else none }}
  standing_down: |-
    {{ precedence_role == 'subordinate'
       and (precedence_lock | default('', true) | length) > 0
       and is_state(precedence_lock, 'on')
       and principal is not none and principal != leader }}
conditions:
- condition: template
  alias: Required switches are on
  value_template: |-
    {{ (require_on | default([]) | count) == 0
       or (require_on | select('is_state', 'on') | list | count)
          == (require_on | count) }}
- condition: template
  alias: Cooldown has passed
  value_template: |-
    {{ (cooldown | int(0)) == 0
       or this.attributes.last_triggered is none
       or (now() - this.attributes.last_triggered).total_seconds()
          > (cooldown | int(0)) }}
- condition: and
  conditions: !input 'extra_conditions'
actions:
- choose:
  - alias: Stand down for the principal
    conditions:
    - condition: template
      value_template: '{{ trigger.id == ''precedence_taken'' and standing_down }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ stand_down_action == ''join_principal'' }}'
        sequence:
        - action: media_player.unjoin
          target:
            entity_id: '{{ follower_ids + [leader] }}'
        - delay:
            milliseconds: 300
        - action: media_player.join
          target:
            entity_id: '{{ principal }}'
          data:
            group_members: '{{ follower_ids + [leader] }}'
      - conditions:
        - condition: template
          value_template: '{{ stand_down_action == ''pause'' }}'
        sequence:
        - action: media_player.media_pause
          target:
            entity_id: '{{ follower_ids + [leader] }}'
      default:
      - action: media_player.unjoin
        target:
          entity_id: '{{ follower_ids + [leader] }}'
  - alias: Precedence released
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'precedence_released'
           and precedence_role == 'subordinate'
           and on_precedence_end != 'keep' }}
    sequence:
    - action: media_player.unjoin
      target:
        entity_id: '{{ follower_ids + [leader] }}'
    - condition: template
      alias: Rebuild rather than release
      value_template: '{{ on_precedence_end == ''rebuild'' }}'
    - delay:
        milliseconds: 400
    - action: sonos_smart_groups.apply
      data:
        leader: '{{ leader }}'
        followers: '{{ followers }}'
        mirror: '{{ mirror }}'
        tolerance: '{{ tolerance }}'
        gap_ms: '{{ gap_ms }}'
  - alias: Take precedence
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'leader_started'
           and precedence_role == 'superior'
           and (precedence_lock | default('', true) | length) > 0 }}
    sequence:
    - action: sonos_smart_groups.take_precedence
      data:
        lock: '{{ precedence_lock }}'
        principal: '{{ leader }}'
    - action: sonos_smart_groups.apply
      data:
        leader: '{{ leader }}'
        followers: '{{ followers }}'
        mirror: '{{ mirror }}'
        tolerance: '{{ tolerance }}'
        gap_ms: '{{ gap_ms }}'
  - alias: Release precedence after the timeout
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'leader_stopped'
           and precedence_role == 'superior'
           and (precedence_lock | default('', true) | length) > 0 }}
    sequence:
    - delay:
        seconds: '{{ precedence_timeout | int(60) }}'
    - condition: template
      alias: Still stopped, and not being held
      value_template: |-
        {{ not is_state(leader, 'playing')
           and ((hold_switch | default('', true) | length) == 0
                or not is_state(hold_switch, 'on')) }}
    - action: sonos_smart_groups.release_precedence
      data:
        lock: '{{ precedence_lock }}'
  - alias: Start by itself
    conditions:
    - condition: template
      value_template: '{{ from_user and has_autostart }}'
    sequence:
    - condition: and
      conditions: !input 'start_conditions'
    - if:
      - condition: template
        value_template: '{{ (start_volume | int(0)) > 0 }}'
      then:
      - action: media_player.volume_set
        target:
          entity_id: '{{ leader }}'
        data:
          volume_level: '{{ (start_volume | float(0)) / 100 }}'
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {{ (start_media | default({}, true)).get('media_content_id')
               is not none }}
        sequence:
        - action: media_player.play_media
          target:
            entity_id: '{{ leader }}'
          data:
            media_content_id: '{{ start_media.media_content_id }}'
            media_content_type: '{{ start_media.media_content_type }}'
      - conditions:
        - condition: template
          value_template: '{{ (start_source | default('''', true) | trim | length) > 0 }}'
        sequence:
        - action: media_player.select_source
          target:
            entity_id: '{{ leader }}'
          data:
            source: '{{ start_source }}'
        - delay:
            milliseconds: 400
    - if:
      - condition: template
        value_template: '{{ start_action == ''play'' }}'
      then:
      - action: media_player.media_play
        target:
          entity_id: '{{ leader }}'
    - if:
      - condition: template
        value_template: '{{ start_action == ''pause'' }}'
      then:
      - action: media_player.media_pause
        target:
          entity_id: '{{ leader }}'
  - alias: Leader stopped
    conditions:
    - condition: template
      value_template: '{{ trigger.id == ''leader_stopped'' }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ on_leader_stop == ''unjoin'' }}'
        sequence:
        - action: media_player.unjoin
          target:
            entity_id: '{{ follower_ids }}'
      - conditions:
        - condition: template
          value_template: '{{ on_leader_stop == ''pause'' }}'
        sequence:
        - action: media_player.media_pause
          target:
            entity_id: '{{ follower_ids }}'
      default:
      - stop: Leader stopped; nothing to do.
  default:
  - condition: template
    alias: Not currently standing down for a superior group
    value_template: '{{ not standing_down }}'
  - condition: template
    alias: No blocking switch is on
    value_template: |-
      {{ (block_if_on | default([]) | select('is_state', 'on')
          | list | count) == 0 }}
  - condition: template
    alias: No blocking room is playing
    value_template: |-
      {{ (block_if_playing | default([]) | select('is_state', 'playing')
          | list | count) == 0 }}
  - condition: template
    alias: The leader is in charge of its own group
    value_template: |-
      {{ not only_when_coordinator
         or (members | count) == 0
         or members[0] == leader }}
  - condition: template
    alias: Source matches
    value_template: |-
      {{ (required_source | default('', true) | trim | length) == 0
         or ((state_attr(leader, 'source') or '') | lower)
            == (required_source | lower | trim) }}
  - condition: template
    alias: Leader is playing
    value_template: '{{ not require_playing or is_state(leader, ''playing'') }}'
  - sequence: !input 'before_actions'
  - action: sonos_smart_groups.apply
    data:
      leader: '{{ leader }}'
      followers: |-
        {{ followers | map('combine', {'join': false}) | list
           if not is_state(leader, 'playing') else followers }}
      mirror: '{{ mirror }}'
      tolerance: '{{ tolerance }}'
      gap_ms: '{{ gap_ms }}'
  - sequence: !input 'after_actions'
