          default: ''
          selector:
            entity:
              filter:
              - domain: switch
              - domain: input_boolean
    autostart_section:
      name: 5 · Automatische activering
      icon: mdi:motion-sensor
      description: Laat de leider automatisch activeren. Laat de automatische activering leeg
        om dit helemaal over te slaan.
      collapsed: true
      input:
        start_triggers:
          name: Starten wanneer
          description: Elke activering die je wilt — een bewegingssensor, een lamp die aangaat,
            een tijdstip, een agenda-afspraak, een NFC-tag.
          default: []
          selector:
            trigger: null
        start_conditions:
          name: Maar alleen als
          default: []
          selector:
            condition: null
        start_media:
          name: Speel dit af
          description: |-
            Opent de mediabrowser: je Sonos-favorieten, je lokale muziekbibliotheek, en Spotify of Plex als je die integraties gebruikt.

            Favorieten zijn de toegang tot al het andere. Apple Music, Tidal, TuneIn en Sonos Radio kun je niet doorbladeren vanuit Home Assistant, maar wat je één keer in de Sonos-app als favoriet markeert verschijnt hier.

            Laat leeg als je alleen van ingang wilt wisselen — gebruik daarvoor het veld hieronder.
          default: {}
          selector:
            media: null
        start_source:
          name: Of schakel naar deze ingang
          description: Wordt alleen gebruikt als je hierboven niets kiest. `TV` voor de eigen
            ingang van een soundbar; een line-in die vanuit een andere kamer gedeeld wordt
            verschijnt onder de naam van die kamer.
          default: ''
          selector:
            select:
              custom_value: true
              options:
              - TV
              - Line-in
              - AirPlay
              - Spotify Connect
        start_volume:
          name: Zet de leider op dit volume
          description: 0 laat het volume ongemoeid.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
        start_action:
          name: Daarna
          default: play
          selector:
            select:
              options:
              - label: Beginnen met afspelen
                value: play
              - label: Pauzeren
                value: pause
              - label: Alleen de bron en het volume instellen
                value: nothing
    tuning_section:
      name: 6 · Fijnafstelling
      icon: mdi:tune
      description: De standaardwaarden zijn geschikt voor vrijwel iedereen. Kom hier pas terug
        als iets traag, schokkerig of te gretig aanvoelt.
      collapsed: true
      input:
        debounce:
          name: Bezinktijd
          description: Hoe lang het volume van de leider stil moet staan voordat de volgers
            meebewegen. Eén seconde maakt van het slepen aan een schuif één aanpassing. Zet
