# Generated by tools/build_blueprints.py - do not edit.
# Change blueprints/_source/ and run the script instead.
blueprint:
  name: Sonos Smart Group
  source_url: https://raw.githubusercontent.com/barloew/sonos_smart_groups/main/custom_components/sonos_smart_groups/blueprints/sonos_smart_group.yaml
  description: |-
    A smart group is one leader room and any number of followers that keep themselves in step with it.

    **Followers copy what you choose.** Volume, mute, source, transport, and — if you want — the equalizer and home theater settings. Volume, bass and treble can each be scaled per follower, so the room at the far end of an open-plan space can sit a little louder without you ever thinking about it again.

    **Smart groups can outrank each other.** Mark one as *superior* and it takes precedence: subordinate groups hand their rooms over and take them back when it is done. A home theater group that takes the living room with it while a film is on is the classic case.

    **Smart groups can start themselves.** On a motion sensor, at a time of day, on any trigger — switching to a source or starting a specific playlist, album, artist or station.

    ---

    One automation describes one smart group. Two rooms that should follow each other both ways need two automations, one per direction.

    Requires the Sonos Smart Groups integration.
  domain: automation
  homeassistant:
    min_version: 2025.7.0
  input:
    group_section:
      name: 1 · The smart group
      icon: mdi:speaker-multiple
      description: Who leads, and who follows. Only the leader is watched — followers never
        trigger anything themselves, which is what keeps two rooms from chasing each other.
      collapsed: false
      input:
        leader:
          name: Leader
          description: The room everyone else takes its cue from. Pick the one you actually
            reach for when you want to change the music — the kitchen rather than the office.
          selector:
            entity:
              filter:
              - domain: media_player
                integration: sonos
              - domain: media_player
                integration: music_assistant
        followers:
          name: Followers
          description: |-
            One row per room.

            **Volume factor** is relative to the leader. 1.0 keeps them level, 1.4 makes the follower noticeably louder, 0.8 quieter. In an open-plan living room the room furthest from the sofa usually wants 1.2 to 1.5.

            **Bass and treble factors** work the same way, and only matter if you switch on equalizer copying in section 2. Leave them at 1.0 unless a room has its speakers in a corner or against glass.

            **Add to group** pulls the room into the leader's group so they play the same thing in sync. Leave it off for a follower that should only match the volume while playing something else.
          selector:
            object:
              label_field: speaker
              description_field: volume_factor
              multiple: true
              fields:
                speaker:
                  label: Room
                  required: true
                  selector:
                    entity:
                      filter:
                      - domain: media_player
                        integration: sonos
                      - domain: media_player
                        integration: music_assistant
                volume_factor:
                  label: Volume factor
                  required: true
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
                join:
                  label: Add to group
                  selector:
                    boolean: null
                bass_factor:
                  label: Bass factor
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
                treble_factor:
                  label: Treble factor
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
    copy_section:
      name: 2 · What followers copy
      icon: mdi:content-copy
      description: |-
        Volume and mute suit almost every smart group. The rest is there when you want it.

        Controls a room does not have are skipped silently, so it is safe to tick surround for a group that mixes a soundbar with bookshelf speakers.
      collapsed: false
      input:
        copy_playback:
          name: Playback
          description: Source and transport only apply to followers that stay out of the group
            — rooms inside a group already follow their leader.
          default:
          - volume
          - mute
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Volume — scaled by each follower's factor
                value: volume
              - label: Mute
                value: mute
              - label: Source — ungrouped followers only
                value: source
              - label: Play and pause — ungrouped followers only
                value: transport
              - label: Crossfade
                value: cross_fade
    when_section:
      name: 3 · When the smart group forms
      icon: mdi:play-circle-outline
      description: By default the group forms as soon as the leader starts playing, which
        is what most people want.
      collapsed: true
      input:
        require_playing:
          name: Only while the leader is playing
          description: Turn this off if followers should track the leader's volume even when
            nothing is playing.
          default: true
          selector:
            boolean: null
        required_source:
          name: Only for this source
          description: Leave empty for any source. Sonos names its inputs `TV`, `Line-in`,
            `AirPlay` and `Spotify Connect`; a line-in shared from another room appears under
            that room's name. Use this when the same room should behave differently depending
            on what it is playing — one smart group for the TV, another for music.
          default: ''
          selector:
            select:
              custom_value: true
              options:
              - TV
              - Line-in
              - AirPlay
              - Spotify Connect
        on_leader_stop:
          name: When the leader stops
          default: nothing
          selector:
            select:
              options:
              - label: Leave everything as it is
                value: nothing
              - label: Release the followers from the group
                value: unjoin
              - label: Pause the followers
                value: pause
        require_on:
          name: Only when these are on
          description: Every entity here must be on. A good place for a master switch that
            disables all your smart groups at once.
          default: []
          selector:
            entity:
              multiple: true
        block_if_on:
          name: Never while these are on
          default: []
          selector:
            entity:
              multiple: true
        block_if_playing:
          name: Never while these rooms are playing
          description: Rooms that outrank this group. Usually unnecessary once you use precedence
            instead.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: media_player
    precedence_section:
      name: 4 · Precedence
      icon: mdi:crown-outline
      description: |-
        Lets one smart group outrank another. Skip this entirely if your groups never need to take over each other's rooms.

        A **superior** group takes precedence when its leader starts. Its leader becomes the *principal*. **Subordinate** groups stand down and hand their rooms over, then take them back afterwards.

        Create locks first: Settings → Devices & services → Sonos Smart Groups → Configure.
      collapsed: true
      input:
        precedence_role:
          name: This smart group is
          default: none
          selector:
            select:
              options:
              - label: Not involved in precedence
                value: none
              - label: Superior — takes precedence over others
                value: superior
              - label: Subordinate — stands down for the superior group
                value: subordinate
        precedence_lock:
          name: Precedence lock
          description: A lock from the Sonos Smart Groups integration.
          default: []
          selector:
            entity:
              filter:
              - domain: switch
                integration: sonos_smart_groups
        stand_down_action:
          name: When standing down, this group's rooms should
          default: join_principal
          selector:
            select:
              options:
              - label: Join the superior group
                value: join_principal
              - label: Leave the group and fall silent
                value: unjoin
              - label: Pause where they are
                value: pause
        on_precedence_end:
          name: When precedence is released
          description: 'Rebuilding is usually right: a smart group knows exactly how it should
            look, so it simply forms itself again. Nothing depends on snapshots.'
          default: rebuild
          selector:
            select:
              options:
              - label: Rebuild this smart group as defined
                value: rebuild
              - label: Leave everything as it is
                value: keep
              - label: Release all rooms
                value: release
        precedence_timeout:
          name: Wait before releasing precedence
          description: When the principal pauses, precedence is not dropped immediately —
            a short wait keeps a pause for the doorbell from tearing the whole arrangement
            apart. Set to 0 to release the moment playback stops.
          default: 60
          selector:
            number:
              min: 0
              max: 1800
              step: 5
              unit_of_measurement: s
        hold_switch:
          name: Hold switch
          description: While this is on, precedence is never released however long playback
            is paused. Useful for a "film night" switch.
          default: ''
          selector:
            entity:
              filter:
              - domain: switch
              - domain: input_boolean
    autostart_section:
      name: 5 · Starting by itself
      icon: mdi:motion-sensor
      description: Have the leader start on its own. Leave the triggers empty to skip this
        entirely.
      collapsed: true
      input:
        start_triggers:
          name: Start when
          description: Any trigger — a motion sensor, a light coming on, a time of day, a
            calendar event, an NFC tag.
          default: []
          selector:
            trigger: null
        start_conditions:
          name: But only if
          default: []
          selector:
            condition: null
        start_media:
          name: Play this
          description: |-
            Opens the media browser: your Sonos favourites, your local music library, and Spotify or Plex if you use those integrations.

            Favourites are the way in to everything else. Apple Music, Tidal, TuneIn and Sonos Radio cannot be browsed from Home Assistant, but anything you favourite once in the Sonos app appears here.

            Leave empty if you only want to switch inputs — use the field below for that.
          default: {}
          selector:
            media: null
        start_source:
          name: Or switch to this input
          description: Only used when nothing is chosen above. `TV` for a soundbar's own input;
            a line-in shared from another room appears under that room's name.
          default: ''
          selector:
            select:
              custom_value: true
              options:
              - TV
              - Line-in
              - AirPlay
              - Spotify Connect
        start_volume:
          name: Set the leader to this volume
          description: 0 leaves the volume untouched.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
        start_action:
          name: Then
          default: play
          selector:
            select:
              options:
              - label: Start playing
                value: play
              - label: Pause
                value: pause
              - label: Only set the source and volume
                value: nothing
    tuning_section:
      name: 6 · Fine-tuning
      icon: mdi:tune
      description: The defaults suit almost everyone. Come back here only if something feels
        slow, jumpy or too eager.
      collapsed: true
      input:
        debounce:
          name: Settle time
          description: How long the leader's volume must hold still before followers move.
            1 second turns a slider drag into a single adjustment. Set to 0 for the snappiest
            response to remote buttons.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 1
              unit_of_measurement: s
        tolerance:
          name: Volume tolerance
          description: Differences smaller than this are left alone. This is what stops two
            rooms nudging each other back and forth. 0.5 lets every single volume step through.
          default: 0.5
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
        gap_ms:
          name: Command gap
          description: Pause after each command. Raise it if playback stutters.
          default: 120
          selector:
            number:
              min: 0
              max: 2000
              step: 10
              unit_of_measurement: ms
        cooldown:
          name: Cooldown
          description: Minimum time between two runs. 0 disables it.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
        only_when_coordinator:
          name: Only when the leader is in charge
          description: Keeps this smart group quiet while its leader is itself following someone
            else. Leave on unless you know otherwise.
          default: true
          selector:
            boolean: null
        extra_triggers:
          name: Extra triggers
          default: []
          selector:
            trigger: null
        extra_conditions:
          name: Extra conditions
          default: []
          selector:
            condition: null
        before_actions:
          name: Run before
          default: []
          selector:
            action: null
        after_actions:
          name: Run after
          default: []
          selector:
            action: null
mode: restart
max_exceeded: silent
triggers:
- trigger: state
  entity_id: !input 'leader'
  attribute: volume_level
  for:
    seconds: !input 'debounce'
  id: sync
- trigger: state
  entity_id: !input 'leader'
  attribute: is_volume_muted
  id: sync
- trigger: state
  entity_id: !input 'leader'
  to: playing
  id: leader_started
- trigger: state
  entity_id: !input 'leader'
  from: playing
  id: leader_stopped
- trigger: state
  entity_id: !input 'leader'
  attribute: source
  id: sync
- trigger: state
  entity_id: !input 'leader'
  attribute: group_members
  for:
    seconds: 2
  id: sync
- trigger: state
  entity_id: !input 'precedence_lock'
  to: 'on'
  id: precedence_taken
- trigger: state
  entity_id: !input 'precedence_lock'
  to: 'off'
  id: precedence_released
- triggers: !input 'start_triggers'
- triggers: !input 'extra_triggers'
variables:
  leader: !input 'leader'
  followers: !input 'followers'
  copy_playback: !input 'copy_playback'
  require_playing: !input 'require_playing'
  required_source: !input 'required_source'
  on_leader_stop: !input 'on_leader_stop'
  require_on: !input 'require_on'
  block_if_on: !input 'block_if_on'
  block_if_playing: !input 'block_if_playing'
  precedence_role: !input 'precedence_role'
  precedence_lock: !input 'precedence_lock'
  stand_down_action: !input 'stand_down_action'
  on_precedence_end: !input 'on_precedence_end'
  precedence_timeout: !input 'precedence_timeout'
  hold_switch: !input 'hold_switch'
  start_trigger_list: !input 'start_triggers'
  start_media: !input 'start_media'
  start_source: !input 'start_source'
  start_volume: !input 'start_volume'
  start_action: !input 'start_action'
  tolerance: !input 'tolerance'
  gap_ms: !input 'gap_ms'
  cooldown: !input 'cooldown'
  only_when_coordinator: !input 'only_when_coordinator'
  mirror: |-
    {{ (copy_playback | default([]))
       + (copy_equalizer | default([]))
       + (copy_home_theater | default([])) }}
  follower_ids: '{{ (followers | default([])) | map(attribute=''speaker'') | list }}'
  members: '{{ state_attr(leader, ''group_members'') or [] }}'
  builtin_ids:
  - sync
  - leader_started
  - leader_stopped
  - precedence_taken
  - precedence_released
  from_user: '{{ (trigger.id | default('''', true)) not in builtin_ids }}'
  has_autostart: '{{ (start_trigger_list | default([], true) | count) > 0 }}'
  principal: |-
    {{ state_attr(precedence_lock, 'principal')
       if (precedence_lock | default('', true) | length) > 0 else none }}
  standing_down: |-
    {{ precedence_role == 'subordinate'
       and (precedence_lock | default('', true) | length) > 0
       and is_state(precedence_lock, 'on')
       and principal is not none and principal != leader }}
conditions:
- condition: template
  alias: Required switches are on
  value_template: |-
    {{ (require_on | default([]) | count) == 0
       or (require_on | select('is_state', 'on') | list | count)
          == (require_on | count) }}
- condition: template
  alias: Cooldown has passed
  value_template: |-
    {{ (cooldown | int(0)) == 0
       or this.attributes.last_triggered is none
       or (now() - this.attributes.last_triggered).total_seconds()
          > (cooldown | int(0)) }}
- condition: and
  conditions: !input 'extra_conditions'
actions:
- choose:
  - alias: Stand down for the principal
    conditions:
    - condition: template
      value_template: '{{ trigger.id == ''precedence_taken'' and standing_down }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ stand_down_action == ''join_principal'' }}'
        sequence:
        - action: media_player.unjoin
          target:
            entity_id: '{{ follower_ids + [leader] }}'
        - delay:
            milliseconds: 300
        - action: media_player.join
          target:
            entity_id: '{{ principal }}'
          data:
            group_members: '{{ follower_ids + [leader] }}'
      - conditions:
        - condition: template
          value_template: '{{ stand_down_action == ''pause'' }}'
        sequence:
        - action: media_player.media_pause
          target:
            entity_id: '{{ follower_ids + [leader] }}'
      default:
      - action: media_player.unjoin
        target:
          entity_id: '{{ follower_ids + [leader] }}'
  - alias: Precedence released
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'precedence_released'
           and precedence_role == 'subordinate'
           and on_precedence_end != 'keep' }}
    sequence:
    - action: media_player.unjoin
      target:
        entity_id: '{{ follower_ids + [leader] }}'
    - condition: template
      alias: Rebuild rather than release
      value_template: '{{ on_precedence_end == ''rebuild'' }}'
    - delay:
        milliseconds: 400
    - action: sonos_smart_groups.apply
      data:
        leader: '{{ leader }}'
        followers: '{{ followers }}'
        mirror: '{{ mirror }}'
        tolerance: '{{ tolerance }}'
        gap_ms: '{{ gap_ms }}'
  - alias: Take precedence
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'leader_started'
           and precedence_role == 'superior'
           and (precedence_lock | default('', true) | length) > 0 }}
    sequence:
    - action: sonos_smart_groups.take_precedence
      data:
        lock: '{{ precedence_lock }}'
        principal: '{{ leader }}'
    - action: sonos_smart_groups.apply
      data:
        leader: '{{ leader }}'
        followers: '{{ followers }}'
        mirror: '{{ mirror }}'
        tolerance: '{{ tolerance }}'
        gap_ms: '{{ gap_ms }}'
  - alias: Release precedence after the timeout
    conditions:
    - condition: template
      value_template: |-
        {{ trigger.id == 'leader_stopped'
           and precedence_role == 'superior'
           and (precedence_lock | default('', true) | length) > 0 }}
    sequence:
    - delay:
        seconds: '{{ precedence_timeout | int(60) }}'
    - condition: template
      alias: Still stopped, and not being held
      value_template: |-
        {{ not is_state(leader, 'playing')
           and ((hold_switch | default('', true) | length) == 0
                or not is_state(hold_switch, 'on')) }}
    - action: sonos_smart_groups.release_precedence
      data:
        lock: '{{ precedence_lock }}'
  - alias: Start by itself
    conditions:
    - condition: template
      value_template: '{{ from_user and has_autostart }}'
    sequence:
    - condition: and
      conditions: !input 'start_conditions'
    - if:
      - condition: template
        value_template: '{{ (start_volume | int(0)) > 0 }}'
      then:
      - action: media_player.volume_set
        target:
          entity_id: '{{ leader }}'
        data:
          volume_level: '{{ (start_volume | float(0)) / 100 }}'
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {{ (start_media | default({}, true)).get('media_content_id')
               is not none }}
        sequence:
        - action: media_player.play_media
          target:
            entity_id: '{{ leader }}'
          data:
            media_content_id: '{{ start_media.media_content_id }}'
            media_content_type: '{{ start_media.media_content_type }}'
      - conditions:
        - condition: template
          value_template: '{{ (start_source | default('''', true) | trim | length) > 0 }}'
        sequence:
        - action: media_player.select_source
          target:
            entity_id: '{{ leader }}'
          data:
            source: '{{ start_source }}'
        - delay:
            milliseconds: 400
    - if:
      - condition: template
        value_template: '{{ start_action == ''play'' }}'
      then:
      - action: media_player.media_play
        target:
          entity_id: '{{ leader }}'
    - if:
      - condition: template
        value_template: '{{ start_action == ''pause'' }}'
      then:
      - action: media_player.media_pause
        target:
          entity_id: '{{ leader }}'
  - alias: Leader stopped
    conditions:
    - condition: template
      value_template: '{{ trigger.id == ''leader_stopped'' }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ on_leader_stop == ''unjoin'' }}'
        sequence:
        - action: media_player.unjoin
          target:
            entity_id: '{{ follower_ids }}'
      - conditions:
        - condition: template
          value_template: '{{ on_leader_stop == ''pause'' }}'
        sequence:
        - action: media_player.media_pause
          target:
            entity_id: '{{ follower_ids }}'
      default:
      - stop: Leader stopped; nothing to do.
  default:
  - condition: template
    alias: Not currently standing down for a superior group
    value_template: '{{ not standing_down }}'
  - condition: template
    alias: No blocking switch is on
    value_template: |-
      {{ (block_if_on | default([]) | select('is_state', 'on')
          | list | count) == 0 }}
  - condition: template
    alias: No blocking room is playing
    value_template: |-
      {{ (block_if_playing | default([]) | select('is_state', 'playing')
          | list | count) == 0 }}
  - condition: template
    alias: The leader is in charge of its own group
    value_template: |-
      {{ not only_when_coordinator
         or (members | count) == 0
         or members[0] == leader }}
  - condition: template
    alias: Source matches
    value_template: |-
      {{ (required_source | default('', true) | trim | length) == 0
         or ((state_attr(leader, 'source') or '') | lower)
            == (required_source | lower | trim) }}
  - condition: template
    alias: Leader is playing
    value_template: '{{ not require_playing or is_state(leader, ''playing'') }}'
  - sequence: !input 'before_actions'
  - action: sonos_smart_groups.apply
    data:
      leader: '{{ leader }}'
      followers: |-
        {{ followers | map('combine', {'join': false}) | list
           if not is_state(leader, 'playing') else followers }}
      mirror: '{{ mirror }}'
      tolerance: '{{ tolerance }}'
      gap_ms: '{{ gap_ms }}'
  - sequence: !input 'after_actions'
