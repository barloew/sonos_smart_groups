# Generated by tools/build_blueprints.py — do not edit.
# Change blueprints/_source/ and run the script instead.
blueprint:
  name: "Sonos Smart Group"
  # Lets Home Assistant offer "Re-import blueprint" in the blueprint list, and
  # lets tools that track blueprints follow this one.
  source_url: https://raw.githubusercontent.com/barloew/sonos_smart_groups/main/custom_components/sonos_smart_groups/blueprints/sonos_smart_group.yaml
  description: >-
    A smart group is one leader room and any number of followers that keep
    themselves in step with it.


    **Followers copy what you choose.** Volume, mute, source, transport, and —
    if you want — the equalizer and home theater settings. Volume, bass and
    treble can each be scaled per follower, so the room at the far end of an
    open-plan space can sit a little louder without you ever thinking about it
    again.


    **Smart groups can outrank each other.** Mark one as *superior* and it takes
    precedence: subordinate groups hand their rooms over and take them back
    when it is done. A home theater group that takes the living room with it
    while a film is on is the classic case.


    **Smart groups can start themselves.** On a motion sensor, at a time of day,
    on any trigger — switching to a source or starting a specific playlist,
    album, artist or station.


    ---


    One automation describes one smart group. Two rooms that should follow
    each other both ways need two automations, one per direction.


    Requires the Sonos Smart Groups integration.
  domain: automation
  homeassistant:
    min_version: 2025.7.0

  input:
    # ═══════════════════════════════════════════════════════════════════════
    group_section:
      name: "1 · De smart group"
      icon: mdi:speaker-multiple
      description: >-
        Who leads, and who follows. Only the leader is watched — followers never
        trigger anything themselves, which is what keeps two rooms from chasing
        each other.
      collapsed: false
      input:
        leader:
          name: Leader
          description: >-
            The room everyone else takes its cue from. Pick the one you actually
            reach for when you want to change the music — the kitchen rather than
            the office.
          selector:
            entity:
              filter:
                - domain: media_player
                  integration: sonos
                - domain: media_player
                  integration: music_assistant

        followers:
          name: Followers
          description: >-
            One row per room.


            **Volume factor** is relative to the leader. 1.0 keeps them level,
            1.4 makes the follower noticeably louder, 0.8 quieter. In an
            open-plan living room the room furthest from the sofa usually wants
            1.2 to 1.5.


            **Lage tonen and treble factors** work the same way, and only matter if
            you switch on equalizer copying in section 2. Leave them at 1.0
            unless a room has its speakers in a corner or against glass.


            **Add to group** pulls the room into the leader's group so they play
            the same thing in sync. Leave it off for a follower that should only
            match the volume while playing something else.
          selector:
            object:
              label_field: speaker
              description_field: volume_factor
              multiple: true
              fields:
                speaker:
                  label: Room
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: media_player
                          integration: sonos
                        - domain: media_player
                          integration: music_assistant
                volume_factor:
                  label: Volume factor
                  required: true
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
                join:
                  label: Add to group
                  selector:
                    boolean:
                bass_factor:
                  label: Lage tonen factor
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box
                treble_factor:
                  label: Hoge tonen factor
                  selector:
                    number:
                      min: 0.1
                      max: 3.0
                      step: 0.05
                      mode: box

    # ═══════════════════════════════════════════════════════════════════════
    copy_section:
      name: "2 · Wat followers overnemen"
      icon: mdi:content-copy
      description: >-
        Volume and mute suit almost every smart group. The rest is there when
        you want it.


        Controls a room does not have are skipped silently, so it is safe to
        tick surround for a group that mixes a soundbar with bookshelf speakers.
      collapsed: false
      input:
        copy_playback:
          name: Afspelen
          description: >-
            Source and transport only apply to followers that stay out of the
            group — rooms inside a group already follow their leader.
          default:
            - volume
            - mute
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: "Volume — geschaald met de factor van elke follower"
                  value: volume
                - label: "Dempen"
                  value: mute
                - label: "Bron — alleen voor ongegroepeerde followers"
                  value: source
                - label: "Afspelen en pauzeren — alleen voor ongegroepeerde followers"
                  value: transport
                - label: "Crossfade"
                  value: cross_fade

    # ═══════════════════════════════════════════════════════════════════════
    when_section:
      name: "3 · Wanneer de groep zich vormt"
      icon: mdi:play-circle-outline
      description: >-
        By default the group forms as soon as the leader starts playing, which
        is what most people want.
      collapsed: true
      input:
        require_playing:
          name: Alleen terwijl de leader speelt
          description: >-
            Turn this off if followers should track the leader's volume even
            when nothing is playing.
          default: true
          selector:
            boolean:

        required_source:
          name: Alleen bij deze bron
          description: >-
            Leave empty for any source. Sonos names its inputs `TV`, `Line-in`,
            `AirPlay` and `Spotify Connect`; a line-in shared from another room
            appears under that room's name. Use this when the same room should
            behave differently depending on what it is playing — one
            smart group for the TV, another for music.
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - "TV"
                - "Line-in"
                - "AirPlay"
                - "Spotify Connect"

        on_leader_stop:
          name: Wanneer de leader stopt
          default: nothing
          selector:
            select:
              options:
                - label: "Laat alles zoals het is"
                  value: nothing
                - label: "Haal de followers uit de groep"
                  value: unjoin
                - label: "Pauzeer de followers"
                  value: pause

        require_on:
          name: Alleen als deze aan staan
          description: >-
            Every entity here must be on. A good place for a master switch that
            disables all your smart groups at once.
          default: []
          selector:
            entity:
              multiple: true

        block_if_on:
          name: Nooit terwijl deze aan staan
          default: []
          selector:
            entity:
              multiple: true

        block_if_playing:
          name: Nooit terwijl deze kamers spelen
          description: >-
            Rooms that outrank this group. Usually unnecessary once you use
            precedence instead.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

    # ═══════════════════════════════════════════════════════════════════════
    precedence_section:
      name: "4 · Voorrang"
      icon: mdi:crown-outline
      description: >-
        Lets one smart group outrank another. Skip this entirely if your groups
        never need to take over each other's rooms.


        A **superior** group takes precedence when its leader starts. Its leader
        becomes the *principal*. **Subordinate** groups stand down and hand
        their rooms over, then take them back afterwards.


        Create locks first: Settings → Devices & services → Sonos Smart Groups →
        Configure.
      collapsed: true
      input:
        precedence_role:
          name: Deze smart group is
          default: none
          selector:
            select:
              options:
                - label: "Doet niet mee aan voorrang"
                  value: none
                - label: "Superior — krijgt voorrang op andere groepen"
                  value: superior
                - label: "Subordinate — wijkt voor de superior groep"
                  value: subordinate

        precedence_lock:
          name: Voorrangsslot
          description: A lock from the Sonos Smart Groups integration.
          # An empty list, not an empty string: this is used as a trigger
          # entity_id, and "" is not a valid entity ID — an automation without
          # precedence would refuse to load. An empty list simply means no
          # entities, so the trigger never fires.
          default: []
          selector:
            entity:
              filter:
                - domain: switch
                  integration: sonos_smart_groups

        stand_down_action:
          name: Bij het wijken doen de kamers van deze groep dit
          default: join_principal
          selector:
            select:
              options:
                - label: "Sluit zich aan bij de superior groep"
                  value: join_principal
                - label: "De groep verlaten en stil vallen"
                  value: unjoin
                - label: "Pauzeren waar ze zijn"
                  value: pause

        on_precedence_end:
          name: Wanneer de voorrang wordt vrijgegeven
          description: >-
            Rebuilding is usually right: a smart group knows exactly how it
            should look, so it simply forms itself again. Nothing depends on
            snapshots.
          default: rebuild
          selector:
            select:
              options:
                - label: "Deze smart group opnieuw opbouwen zoals ingesteld"
                  value: rebuild
                - label: "Laat alles zoals het is"
                  value: keep
                - label: "Alle kamers vrijgeven"
                  value: release

        precedence_timeout:
          name: Wachttijd voor het vrijgeven van voorrang
          description: >-
            When the principal pauses, precedence is not dropped immediately —
            a short wait keeps a pause for the doorbell from tearing the whole
            arrangement apart. Set to 0 to release the moment playback stops.
          default: 60
          selector:
            number:
              min: 0
              max: 1800
              step: 5
              unit_of_measurement: s

        hold_switch:
          name: Vasthoudschakelaar
          description: >-
            While this is on, precedence is never released however long
            playback is paused. Useful for a "film night" switch.
          default: ""
          selector:
            entity:
              filter:
                - domain: switch
                - domain: input_boolean

    # ═══════════════════════════════════════════════════════════════════════
    autostart_section:
      name: "5 · Vanzelf starten"
      icon: mdi:motion-sensor
      description: >-
        Have the leader start on its own. Leave the triggers empty to skip this
        entirely.
      collapsed: true
      input:
        start_triggers:
          name: Starten wanneer
          description: >-
            Any trigger — a motion sensor, a light coming on, a time of day, a
            calendar event, an NFC tag.
          default: []
          selector:
            trigger:

        start_conditions:
          name: Maar alleen als
          default: []
          selector:
            condition:

        start_media:
          name: Speel dit af
          description: >-
            Opens the media browser: your Sonos favourites, your local music
            library, and Spotify or Plex if you use those integrations.


            Favourites are the way in to everything else. Apple Music, Tidal,
            TuneIn and Sonos Radio cannot be browsed from Home Assistant, but
            anything you favourite once in the Sonos app appears here.


            Leave empty if you only want to switch inputs — use the field below
            for that.
          default: {}
          selector:
            media:

        start_source:
          name: Of schakel naar deze ingang
          description: >-
            Only used when nothing is chosen above. `TV` for a soundbar's own
            input; a line-in shared from another room appears under that room's
            name.
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - "TV"
                - "Line-in"
                - "AirPlay"
                - "Spotify Connect"

        start_volume:
          name: Zet de leader op dit volume
          description: 0 leaves the volume untouched.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1

        start_action:
          name: Daarna
          default: play
          selector:
            select:
              options:
                - label: "Beginnen met afspelen"
                  value: play
                - label: "Pauzeren"
                  value: pause
                - label: "Alleen de bron en het volume instellen"
                  value: nothing

    # ═══════════════════════════════════════════════════════════════════════
    tuning_section:
      name: "6 · Fijnafstelling"
      icon: mdi:tune
      description: >-
        The defaults suit almost everyone. Come back here only if something
        feels slow, jumpy or too eager.
      collapsed: true
      input:
        debounce:
          name: Bezinktijd
          description: >-
            How long the leader's volume must hold still before followers move.
            1 second turns a slider drag into a single adjustment. Set to 0 for
            the snappiest response to remote buttons.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 1
              unit_of_measurement: s

        tolerance:
          name: Volumetolerantie
          description: >-
            Differences smaller than this are left alone. This is what stops
            two rooms nudging each other back and forth. 0.5 lets every single
            volume step through.
          default: 0.5
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5

        gap_ms:
          name: Pauze tussen commando's
          description: Pauzeren after each command. Raise it if playback stutters.
          default: 120
          selector:
            number:
              min: 0
              max: 2000
              step: 10
              unit_of_measurement: ms

        cooldown:
          name: Afkoeltijd
          description: Minimum time between two runs. 0 disables it.
          default: 0
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s

        only_when_coordinator:
          name: Alleen als de leader de baas is
          description: >-
            Keeps this smart group quiet while its leader is itself following
            someone else. Leave on unless you know otherwise.
          default: true
          selector:
            boolean:

        extra_triggers:
          name: Extra triggers
          default: []
          selector:
            trigger:

        extra_conditions:
          name: Extra voorwaarden
          default: []
          selector:
            condition:

        before_actions:
          name: Vooraf uitvoeren
          default: []
          selector:
            action:

        after_actions:
          name: Achteraf uitvoeren
          default: []
          selector:
            action:

# ═══════════════════════════════════════════════════════════════════════════
mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input leader
    attribute: volume_level
    for:
      seconds: !input debounce
    id: sync

  - trigger: state
    entity_id: !input leader
    attribute: is_volume_muted
    id: sync

  - trigger: state
    entity_id: !input leader
    to: "playing"
    id: leader_started

  - trigger: state
    entity_id: !input leader
    from: "playing"
    id: leader_stopped

  - trigger: state
    entity_id: !input leader
    attribute: source
    id: sync

  - trigger: state
    entity_id: !input leader
    attribute: group_members
    for:
      seconds: 2
    id: sync

  - trigger: state
    entity_id: !input precedence_lock
    to: "on"
    id: precedence_taken

  - trigger: state
    entity_id: !input precedence_lock
    to: "off"
    id: precedence_released

  # Een genest trigger-item mag maar één sleutel hebben, anders pakt Home
  # Assistant het niet uit (_base_trigger_list_flatten). Er kan dus geen `id`
  # bij; de autostart-tak herkent zichzelf hieronder aan de variabele
  # `builtin_ids`.
  - triggers: !input start_triggers

  - triggers: !input extra_triggers

variables:
  leader: !input leader
  followers: !input followers
  copy_playback: !input copy_playback
  require_playing: !input require_playing
  required_source: !input required_source
  on_leader_stop: !input on_leader_stop
  require_on: !input require_on
  block_if_on: !input block_if_on
  block_if_playing: !input block_if_playing
  precedence_role: !input precedence_role
  precedence_lock: !input precedence_lock
  stand_down_action: !input stand_down_action
  on_precedence_end: !input on_precedence_end
  precedence_timeout: !input precedence_timeout
  hold_switch: !input hold_switch
  start_trigger_list: !input start_triggers
  start_media: !input start_media
  start_source: !input start_source
  start_volume: !input start_volume
  start_action: !input start_action
  tolerance: !input tolerance
  gap_ms: !input gap_ms
  cooldown: !input cooldown
  only_when_coordinator: !input only_when_coordinator

  mirror: >-
    {{ (copy_playback | default([]))
       + (copy_equalizer | default([]))
       + (copy_home_theater | default([])) }}
  follower_ids: "{{ (followers | default([])) | map(attribute='speaker') | list }}"
  members: "{{ state_attr(leader, 'group_members') or [] }}"

  # Triggers the blueprint defines itself. Anything else must have come from
  # one of the user's own trigger lists, which cannot carry an id of our
  # choosing: Home Assistant only unpacks a nested `triggers:` item when it is
  # the only key in that item.
  builtin_ids:
    - sync
    - leader_started
    - leader_stopped
    - precedence_taken
    - precedence_released
  from_user: >-
    {{ (trigger.id | default('', true)) not in builtin_ids }}
  # Whether this smart group is meant to start by itself at all. If you fill in
  # both "Starten wanneer" and "Extra triggers", an extra trigger will also run the
  # start actions — the two lists are indistinguishable once they fire.
  has_autostart: >-
    {{ (start_trigger_list | default([], true) | count) > 0 }}
  principal: >-
    {{ state_attr(precedence_lock, 'principal')
       if (precedence_lock | default('', true) | length) > 0 else none }}
  standing_down: >-
    {{ precedence_role == 'subordinate'
       and (precedence_lock | default('', true) | length) > 0
       and is_state(precedence_lock, 'on')
       and principal is not none and principal != leader }}

conditions:
  - condition: template
    alias: "Required switches are on"
    value_template: >-
      {{ (require_on | default([]) | count) == 0
         or (require_on | select('is_state', 'on') | list | count)
            == (require_on | count) }}

  - condition: template
    alias: "Afkoeltijd has passed"
    value_template: >-
      {{ (cooldown | int(0)) == 0
         or this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds()
            > (cooldown | int(0)) }}

  - condition: and
    conditions: !input extra_conditions

actions:
  - choose:
      # ── A superior smart group took precedence ─────────────────────────
      - alias: "Stand down for the principal"
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'precedence_taken' and standing_down }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ stand_down_action == 'join_principal' }}"
                sequence:
                  - action: media_player.unjoin
                    target:
                      entity_id: "{{ follower_ids + [leader] }}"
                  - delay:
                      milliseconds: 300
                  - action: media_player.join
                    target:
                      entity_id: "{{ principal }}"
                    data:
                      group_members: "{{ follower_ids + [leader] }}"
              - conditions:
                  - condition: template
                    value_template: "{{ stand_down_action == 'pause' }}"
                sequence:
                  - action: media_player.media_pause
                    target:
                      entity_id: "{{ follower_ids + [leader] }}"
            default:
              - action: media_player.unjoin
                target:
                  entity_id: "{{ follower_ids + [leader] }}"

      # ── Precedence released: take our speakers back ────────────────────
      - alias: "Precedence released"
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'precedence_released'
                 and precedence_role == 'subordinate'
                 and on_precedence_end != 'keep' }}
        sequence:
          - action: media_player.unjoin
            target:
              entity_id: "{{ follower_ids + [leader] }}"
          - condition: template
            alias: "Rebuild rather than release"
            value_template: "{{ on_precedence_end == 'rebuild' }}"
          - delay:
              milliseconds: 400
          - action: sonos_smart_groups.apply
            data:
              leader: "{{ leader }}"
              followers: "{{ followers }}"
              mirror: "{{ mirror }}"
              tolerance: "{{ tolerance }}"
              gap_ms: "{{ gap_ms }}"

      # ── We are superior and our leader started ─────────────────────────
      - alias: "Take precedence"
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'leader_started'
                 and precedence_role == 'superior'
                 and (precedence_lock | default('', true) | length) > 0 }}
        sequence:
          - action: sonos_smart_groups.take_precedence
            data:
              lock: "{{ precedence_lock }}"
              principal: "{{ leader }}"
          - action: sonos_smart_groups.apply
            data:
              leader: "{{ leader }}"
              followers: "{{ followers }}"
              mirror: "{{ mirror }}"
              tolerance: "{{ tolerance }}"
              gap_ms: "{{ gap_ms }}"

      # ── We are superior and our leader stopped ─────────────────────────
      - alias: "Release precedence after the timeout"
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'leader_stopped'
                 and precedence_role == 'superior'
                 and (precedence_lock | default('', true) | length) > 0 }}
        sequence:
          - delay:
              seconds: "{{ precedence_timeout | int(60) }}"
          - condition: template
            alias: "Still stopped, and not being held"
            value_template: >-
              {{ not is_state(leader, 'playing')
                 and ((hold_switch | default('', true) | length) == 0
                      or not is_state(hold_switch, 'on')) }}
          - action: sonos_smart_groups.release_precedence
            data:
              lock: "{{ precedence_lock }}"

      # ── Starting by itself ─────────────────────────────────────────────
      - alias: "Start by itself"
        conditions:
          - condition: template
            value_template: "{{ from_user and has_autostart }}"
        sequence:
          - condition: and
            conditions: !input start_conditions

          - if:
              - condition: template
                value_template: "{{ (start_volume | int(0)) > 0 }}"
            then:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ leader }}"
                data:
                  volume_level: "{{ (start_volume | float(0)) / 100 }}"

          - choose:
              # Something was picked in the media browser.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (start_media | default({}, true)).get('media_content_id')
                         is not none }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ leader }}"
                    data:
                      media_content_id: "{{ start_media.media_content_id }}"
                      media_content_type: "{{ start_media.media_content_type }}"
              # Otherwise switch inputs.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (start_source | default('', true) | trim | length) > 0 }}
                sequence:
                  - action: media_player.select_source
                    target:
                      entity_id: "{{ leader }}"
                    data:
                      source: "{{ start_source }}"
                  - delay:
                      milliseconds: 400

          - if:
              - condition: template
                value_template: "{{ start_action == 'play' }}"
            then:
              - action: media_player.media_play
                target:
                  entity_id: "{{ leader }}"
          - if:
              - condition: template
                value_template: "{{ start_action == 'pause' }}"
            then:
              - action: media_player.media_pause
                target:
                  entity_id: "{{ leader }}"

      # ── Leader stopped ─────────────────────────────────────────────────
      - alias: "Leader stopped"
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'leader_stopped' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ on_leader_stop == 'unjoin' }}"
                sequence:
                  - action: media_player.unjoin
                    target:
                      entity_id: "{{ follower_ids }}"
              - conditions:
                  - condition: template
                    value_template: "{{ on_leader_stop == 'pause' }}"
                sequence:
                  - action: media_player.media_pause
                    target:
                      entity_id: "{{ follower_ids }}"
            default:
              - stop: "Leader stopped; nothing to do."

    # ── Normal mirroring ─────────────────────────────────────────────────
    default:
      - condition: template
        alias: "Not currently standing down for a superior group"
        value_template: "{{ not standing_down }}"

      - condition: template
        alias: "No blocking switch is on"
        value_template: >-
          {{ (block_if_on | default([]) | select('is_state', 'on')
              | list | count) == 0 }}

      - condition: template
        alias: "No blocking room is playing"
        value_template: >-
          {{ (block_if_playing | default([]) | select('is_state', 'playing')
              | list | count) == 0 }}

      - condition: template
        alias: "The leader is in charge of its own group"
        value_template: >-
          {{ not only_when_coordinator
             or (members | count) == 0
             or members[0] == leader }}

      - condition: template
        alias: "Source matches"
        value_template: >-
          {{ (required_source | default('', true) | trim | length) == 0
             or ((state_attr(leader, 'source') or '') | lower)
                == (required_source | lower | trim) }}

      - condition: template
        alias: "Leader is playing"
        value_template: >-
          {{ not require_playing or is_state(leader, 'playing') }}

      - sequence: !input before_actions

      - action: sonos_smart_groups.apply
        data:
          leader: "{{ leader }}"
          followers: >-
            {{ followers | map('combine', {'join': false}) | list
               if not is_state(leader, 'playing') else followers }}
          mirror: "{{ mirror }}"
          tolerance: "{{ tolerance }}"
          gap_ms: "{{ gap_ms }}"

      - sequence: !input after_actions
